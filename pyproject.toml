[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecos-reader"
version = "0.5.0"
description = "한국은행 ECOS Open API Python 클라이언트"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "yeonguk" }
]
keywords = ["ecos", "bok", "korea", "economy", "macro", "finance", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.28.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "responses>=0.23.0",
    "pre-commit>=3.0.0",
    "types-requests>=2.28.0",
]
docs = [
    "mkdocs>=1.5.0,<2.0.0",
    "mkdocs-material>=9.5.0,<10.0.0",
    "mkdocstrings[python]>=0.24.0",
    "pymdown-extensions>=10.0",
]

[project.urls]
Homepage = "https://github.com/choo121600/ecos-reader"
Documentation = "https://choo121600.github.io/ecos-reader/"
Repository = "https://github.com/choo121600/ecos-reader"
Issues = "https://github.com/choo121600/ecos-reader/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ecos"]
# 카탈로그 스냅샷(#103)을 휠에 포함 (.gz 데이터 파일을 명시적으로 동봉)
artifacts = ["src/ecos/data/*.csv.gz"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/ecos/data/*.csv.gz"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "S",      # flake8-bandit (보안 스캔)
    "RUF",    # Ruff 고유 규칙
    "PT",     # flake8-pytest-style
    "TC",     # flake8-type-checking
    "N",      # pep8-naming
]
ignore = [
    "E501",   # line too long (handled by formatter)
    # 한국어 docstring/주석의 전각·수학기호(×, 전각괄호 등)를 ASCII 혼동 문자로
    # 오탐. 한국어 코드베이스 전반에 걸친 false positive이므로 비활성화.
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
]

[tool.ruff.lint.isort]
known-first-party = ["ecos"]

[tool.ruff.lint.per-file-ignores]
# __init__.py는 공개 API re-export 모듈. __all__을 동적 생성(#16)하므로
# 정적 분석이 re-export를 인식하지 못해 F401이 오탐된다.
# __all__은 카테고리별 주석으로 의도적으로 그룹핑되어 있어 RUF022(알파벳 정렬)는
# 그 가독성 구조를 훼손하므로 제외.
"__init__.py" = ["F401", "RUF022"]
# 테스트는 assert 사용이 정상(S101)이고, 지표 한글명을 그대로 쓴 서술적
# 테스트 함수명(N802)을 의도적으로 허용한다.
"tests/**" = ["S101", "N802"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
markers = [
    "e2e: tests that call the real ECOS Open API (require ECOS_API_KEY)",
]

[tool.mypy]
python_version = "3.10"
# py.typed 광고와 실제 타입 안전성을 일치시키기 위해 strict 모드 적용 (#17).
# strict는 disallow_untyped_defs / disallow_incomplete_defs / check_untyped_defs /
# disallow_any_generics / warn_return_any / warn_unused_ignores /
# no_implicit_reexport 등을 일괄 활성화한다.
strict = true
warn_unused_configs = true
# pandas 등 일부 서드파티는 완전한 stub을 제공하지 않으므로 누락 import는 무시.
ignore_missing_imports = true

# indicators 패키지는 __all__을 런타임에 동적 생성(#16)하므로 mypy가 재노출을
# 정적으로 인식하지 못한다. 이 집계(aggregator) 모듈에 한해 implicit reexport 허용.
[[tool.mypy.overrides]]
module = ["ecos.indicators"]
implicit_reexport = true

[tool.coverage.run]
source = ["src/ecos"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
]
