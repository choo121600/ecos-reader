name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'  # v0.1.0, v0.1.1 등의 태그에 반응

permissions:
  contents: read

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml
    # 재사용 워크플로우는 caller의 top-level permissions를 상속한다.
    # publish.yml의 top-level은 `contents: read`로 최소화되어 있어 ci.yml의
    # 체크아웃에 충분하며, 향후 top-level 권한이 올라가더라도 ci 잡에는
    # 의도하지 않은 권한이 흘러가지 않도록 여기서 명시한다.
    permissions:
      contents: read
    # secrets는 의도적으로 상속하지 않음 — ci.yml은 외부 시크릿이 필요 없음.

  build:
    name: Build distribution
    needs:
      - ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ecos-reader
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs:
      - publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write  # IMPORTANT: mandatory for creating releases

    steps:
      - uses: actions/checkout@v7

      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract changelog for this version
        id: changelog
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          # CHANGELOG.md에서 ## [<VERSION>] 헤더 다음 줄부터 다음 ## [ 헤더
          # (없으면 EOF) 직전까지 추출. awk를 쓰는 이유: 과거의 `sed | sed '$d'`
          # 패턴은 대상 버전이 CHANGELOG의 마지막 섹션일 때 본문 마지막 줄을
          # 잘라먹어 release notes가 조용히 잘려 게시됨.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {flag=1; next}
            flag && /^## \[/        {exit}
            flag                    {print}
          ' CHANGELOG.md > release_notes.md
          # 비어 있거나 공백뿐이면 실패
          if [ ! -s release_notes.md ] || ! grep -q '[^[:space:]]' release_notes.md; then
            echo "::error::CHANGELOG.md에서 버전 ${VERSION} 섹션을 찾지 못했거나 비어 있습니다."
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' \
            --title 'Release ${{ github.ref_name }}' \
            --notes-file release_notes.md \
            dist/*
