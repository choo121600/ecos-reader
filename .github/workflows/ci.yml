name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow는 이미 워크플로우 단위로 격리되므로 추가 ci- 접두사는 중복.
  group: ${{ github.workflow }}-${{ github.ref }}
  # PR에서만 in-flight를 취소. main push / 향후 tag-driven 호출(release gate)에서는
  # 진행 중인 검증을 끊지 않도록 한다.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 주의: 본 워크플로우는 publish.yml에서 `needs: [ci]` 게이트로 호출됨 (PR #22).
  # 각 잡에 `continue-on-error: true`를 추가하면 게이트가 무효화되므로 사용 금지.

  lint-type:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dev dependencies
        # --python 3.12 명시 — 러너에 다른 Python이 있을 때도 일관된 환경 유지
        run: uv sync --extra dev --python 3.12

      - name: Ruff check
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Mypy
        run: uv run mypy src/ecos

  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dev dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Run unit tests
        run: uv run pytest -m "not e2e"
