site_name: ecos-reader
site_description: 한국은행 ECOS Open API Python 클라이언트
site_author: yeonguk
site_url: https://github.com/choo121600/ecos-reader

repo_name: choo121600/ecos-reader
repo_url: https://github.com/choo121600/ecos-reader

# 깨진 링크/누락 페이지를 빌드 실패로 검출 (#18).
strict: true
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  nav:
    omitted_files: warn
    not_found: warn

theme:
  name: material
  language: ko
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 다크 모드로 전환
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 라이트 모드로 전환
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search:
      lang: ko
  # docstring 기반 API 문서 자동 생성 (#18). NumPy 스타일 docstring 사용.
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            heading_level: 2

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/choo121600/ecos-reader

# 자동 생성 데이터 카탈로그(834표 대용량, scripts/audit_codes.py catalog)는
# 사이트 nav 에서 제외 — mkdocs --strict 빌드 통과용 (#67).
not_in_nav: |
  /reference/ecos_code_catalog.md

nav:
  - 홈: index.md
  - 시작하기:
      - 설치: getting-started/installation.md
      - 빠른 시작: getting-started/quickstart.md
  - 사용자 가이드:
      - 기본 사용법: user-guide/basic-usage.md
      - 금리 지표: user-guide/interest-rates.md
      - 물가 지표: user-guide/prices.md
      - 성장 지표: user-guide/growth.md
      - 통화 지표: user-guide/money.md
      - 재정 지표: user-guide/fiscal.md
      - 금융시장 지표: user-guide/financial-markets.md
      - 고급 기능: user-guide/advanced.md
      - frequency 마이그레이션: user-guide/migration-frequency.md
      - v0.3.0 마이그레이션: user-guide/migration-v0.3.0.md
      - v0.4.0 마이그레이션: user-guide/migration-v0.4.0.md
  - API 레퍼런스:
      - 개요: api-reference/overview.md
      - 클라이언트: api-reference/client.md
      - 지표 함수: api-reference/indicators.md
      - 예외 처리: api-reference/exceptions.md
      - 통계 검색: api-reference/statistic-search.md
      - 통계 항목 목록: api-reference/statistic-item-list.md
      - 통계 메타: api-reference/statistic-meta.md
      - 통계표 목록: api-reference/statistic-table-list.md
      - 통계 Top 100: api-reference/statistic-top-100.md
      - 통계 용어: api-reference/statistic-word.md
  - 예제:
      - 기본 사용법: examples/basic.md
      - 거시경제 대시보드: examples/dashboard.md
  - 개발:
      - 기여하기: development/contributing.md
      - 릴리스 가이드: development/release.md
      - 지표 레지스트리: development/indicator-registry.md
      - Partial-coverage 재설계 규약: development/partial-coverage-redesign.md
